name: Deployment (Container)
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'env-variables-secrets/**'
      - '.github/workflows/deploy-container.yml'
env:
  CACHE_KEY: node-deps
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    # [AGGIUNTO]: Imposta la cartella di lavoro per tutti i comandi 'run' di questo job
    defaults:
      run:
        working-directory: ./env-variables-secrets
    env:
      MONGODB_CONNECTION_PROTOCOL: mongodb+srv
      MONGODB_CLUSTER_ADDRESS:  cluster0.sizxk9i.mongodb.net
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      PORT: 8080
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT # requires MongoDB Atlas to accept requests from anywhere!
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Build Docker image
        run: |
          docker build \
            --build-arg MONGODB_USERNAME=${{ secrets.MONGODB_USERNAME }} \
            --build-arg MONGODB_PASSWORD=${{ secrets.MONGODB_PASSWORD }} \
            -t gha-demo:latest \
            ./env-variables-secrets
      - name: Output information
        env:
          PORT: 3000
        run: |        
          echo "MONGODB_DB_NAME: ${{ env.MONGODB_DB_NAME }}"
          echo "Docker image built successfully"
          echo "${{ env.PORT }}"
